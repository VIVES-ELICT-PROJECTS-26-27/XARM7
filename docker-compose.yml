services:
  xarm7-ctl:
    build: .
    container_name: xarm7-ctl
    privileged: true
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=:1
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - PULSE_SERVER=/mnt/wslg/PulseServer
      - QT_QPA_PLATFORM=xcb
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=3.3
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg
      - ./src:/home/ubuntu/src
      - ./scene_objects:/home/ubuntu/scene_objects
      - /dev/input:/dev/input
      - overlay_ws:/home/ubuntu/overlay_ws
      - ./packages:/home/ubuntu/overlay_ws/src
      - ./tutorials:/home/ubuntu/overlay_ws/src/tutorials
    restart: unless-stopped

volumes:
  overlay_ws:
